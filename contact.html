<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <title>Dao's Stuff</title>
  <meta name="description" content="Dao's Portfolio Site">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="./img/logo.jpg">

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuToggle = document.querySelector('.menu-toggle');
      const menu = document.getElementById('offcanvas-menu');
  
      menuToggle.addEventListener('click', () => {
        const expanded = menuToggle.getAttribute('aria-expanded') === 'true' || false;
        menuToggle.setAttribute('aria-expanded', !expanded);
        menu.classList.toggle('expanded');
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('#contact-form');
      
      form.addEventListener('submit', (e) => {

  
        const name = form.querySelector('[name="name"]').value;
        const email = form.querySelector('[name="email"]').value;
        const message = form.querySelector('[name="message"]').value;

        if (name && email && message) {
          form.reset();
        } else {
          alert('Please fill out all fields.');
        }
      });
    });



  </script>

</head>

<body>
  <header>
    <div class="port-content">
      <img src="./img/logo.jpg" alt="" class="logo">
      <div class="site-text">
        <h1>Dao's Stuff</h1>
        <p>Hi, I'm Alyssa.</p>
      </div>
    </div>
    
    <button class="menu-toggle" aria-expanded="false" aria-controls="offcanvas-menu" aria-label="Toggle navigation menu">Menu</button>
    <nav id="offcanvas-menu" class="menu">
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./portfolio.html">Portfolio</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <h2>Questions? Contact me!</h2>
      <form id="contact-form" class="contact-form" action="thankyou.html" method="GET">
        <div class="form-group">
          <label for="name">Full Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="4" required></textarea>
        </div>
        <p>I'll reach out in 3-5 business days once the message is sucessfully sent.</p>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Alyssa Dao</p>
  </footer>
  <script src="js/main.js"></script>
</body>

</html>
