<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <title>Responsive Layouts</title>
  <meta name="description" content="This site will serve as the hub for many sub responsive layouts">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon.png">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuToggle = document.querySelector('.menu-toggle');
      const menu = document.getElementById('offcanvas-menu');
  
      menuToggle.addEventListener('click', () => {
        const expanded = menuToggle.getAttribute('aria-expanded') === 'true' || false;
        menuToggle.setAttribute('aria-expanded', !expanded);
        menu.classList.toggle('expanded');
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
    const imageContainer = document.querySelector('.carousel-images');
    const images = document.querySelectorAll('.carousel-images img');
    const nextBtn = document.querySelector('.carousel-btn.next');
    const prevBtn = document.querySelector('.carousel-btn.prev');
    
    let currentIndex = 0;

    function updateCarousel() {
      const imageWidth = images[0].clientWidth;
      imageContainer.style.transform = `translateX(-${currentIndex * imageWidth}px)`;
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      updateCarousel();
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateCarousel();
    }

    nextBtn.addEventListener('click', nextImage);
    prevBtn.addEventListener('click', prevImage);

    // Auto-advance every 5 seconds
    setInterval(nextImage, 5000);

    // Adjust carousel on window resize
    window.addEventListener('resize', updateCarousel);

    // Initial positioning
    updateCarousel();
  });
  </script>

</head>

<body>
  <header>
    <div class="port-content">
      <img src="./img/logo.jpg" alt="" class="logo">
      <div class="site-text">

      </div>
    </div>
    
    <button class="menu-toggle" aria-expanded="false" aria-controls="offcanvas-menu" aria-label="Toggle navigation menu">Menu</button>
    <nav id="offcanvas-menu" class="menu">
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./portfolio.html">Portfolio</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>

<div class="index-paragraph">
  <p>My background is in 2D, and I'm working towards improving my 3D modeling skills.</p>
</div>

  <div class="carousel-container">
    <div class="carousel">
      <div class="carousel-images">
        <img src="./img/AF_1.jpg" alt="art fight image 1">
        <img src="./img/AF_2.jpg" alt="art fight image 2">
        <img src="./img/AF_3.jpg" alt="art fight image 3">
        <img src="./img/b_and_g.jpg" alt="3d model image 1">
        <img src="./img/b_and_g2.jpg" alt="3d model image 2">
        <img src="./img/b_and_g_3.jpg" alt="3d model image 3">
        <img src="./img/BMBF_1.jpg" alt="3d model image 4">
        <img src="./img/BMBF_2.jpg" alt="3d model image 5">
        <img src="./img/BMBF_3.jpg" alt="3d model image 6">
        <img src="./img/FOX_1.jpg" alt="3d model image 7">
        <img src="./img/FOX_2.jpg" alt="3d model image 8">
        <img src="./img/FOX_3.jpg" alt="3d model image 9">
      </div>
      <button class="carousel-btn prev">&#10094;</button>
      <button class="carousel-btn next">&#10095;</button>
    </div>
    
    <div class="portfolio-button">
      <a href="./portfolio.html" class="btn">Go to my Portfolio</a>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Alyssa Dao</p>
  </footer>
  <script src="js/main.js"></script>
</body>

</html>
