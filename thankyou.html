<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <title>Responsive Layouts</title>
  <meta name="description" content="This site will serve as the hub for many sub responsive layouts">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon.png">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuToggle = document.querySelector('.menu-toggle');
      const menu = document.getElementById('offcanvas-menu');
  
      menuToggle.addEventListener('click', () => {
        const expanded = menuToggle.getAttribute('aria-expanded') === 'true' || false;
        menuToggle.setAttribute('aria-expanded', !expanded);
        menu.classList.toggle('expanded');
      });
    });
  </script>

</head>

<body>
  <header>
    <div class="port-content">
      <img src="./img/logo.jpg" alt="" class="logo">
      <div class="site-text">
        <h1>Dao's Stuff</h1>
        <p>Hi, I'm Alyssa.</p>
      </div>
    </div>
    
    <button class="menu-toggle" aria-expanded="false" aria-controls="offcanvas-menu" aria-label="Toggle navigation menu">Menu</button>
    <nav id="offcanvas-menu" class="menu">
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./portfolio.html">Portfolio</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>

  <header>
    <div class="port-content">
      <img src="./img/vrchatart.jpg" alt="" class="logo">
      <div class="site-text">
        <h1>Thank You for your Inquiry!</h1>
      </div>
    </div>
  </header>

  <main>
    <section class="thank-you-section">
      <h2>Your message has been sent successfully.</h2>
      <p>I'll answer back with an email as soon as I can!</p>
      
      <div class="portfolio-button">
        <a href="./index.html" class="btn">Return Home</a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Alyssa Dao</p>
  </footer>
  <script src="js/main.js"></script>
</body>

</html>
